<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>for lumpia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --ink:#111111;
    --charcoal:#2b2b2b;
    --pewter:#8a8a8a;
    --mist:#d6d6d6;
    --paper:#ffffff;
    --mat:#87888a;
    --band:#d9d9d9;
    --rose:#c81d3f;
    --rose-dark:#8f0f28;
    --leaf:#3f6b3f;
  }
  *{ -webkit-font-smoothing:antialiased; box-sizing:border-box; }
  html,body{ height:100%; margin:0; padding:0; overflow:hidden; }
  body{
    background:var(--paper);
    font-family:'Inter', sans-serif;
    color:var(--ink);
  }
  .display{ font-family:'Plus Jakarta Sans', sans-serif; }

  /* ---------- stage: full screen canvas ---------- */
  #stageWrap{
    width:100vw;
    height:100vh;
    height:100dvh;
    position:relative;
    overflow:hidden;
  }
  #stage{
    position:relative;
    width:100%;
    height:100%;
    background:var(--paper);
    overflow:hidden;
  }

  .layer{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    overflow:hidden;
  }
  .layer.show{ pointer-events:auto; }

  /* ================= SCENE A — kinetic intro ================= */
  .a-sub{ position:absolute; inset:0; opacity:0; display:flex; align-items:center; justify-content:center; }
  .ghost{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#d8d8d8; filter:blur(1px); transform:translate(-4%,-6%) scale(1.18);
    z-index:1; text-align:center; line-height:1;
  }
  .front{ position:relative; z-index:3; text-align:center; line-height:1.05; }
  .lyric-word{ color:var(--mist); transition:color .25s ease; }
  .lyric-word.on{ color:var(--ink); }
  .bigmark{
    position:absolute; bottom:6%; right:4%; z-index:4;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:var(--ink);
    font-size: clamp(60px, 10vw, 120px); line-height:1; opacity:0; transform:scale(.4) rotate(-14deg);
    transition:opacity .35s ease, transform .45s cubic-bezier(.2,1.4,.4,1);
  }
  .bigmark.on{ opacity:1; transform:scale(1) rotate(-6deg); }
  .scribble-star{ position:absolute; top:6%; left:4%; width: clamp(80px, 20vw, 200px); opacity:0; z-index:2; transition:opacity .4s ease; }
  .scribble-star.on{ opacity:1; }
  .dot-field{ position:absolute; inset:0; z-index:1; pointer-events:none; }
  .dot-field span{ position:absolute; border-radius:9999px; background:var(--mist); opacity:0; transition:opacity .5s ease; }
  .dot-field span.on{ opacity:1; }

  .zoomline{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    z-index:2;
  }
  .zoomline .txt{
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; color:var(--ink);
    font-size: clamp(32px, 6vw, 75px); white-space:nowrap; will-change:transform;
  }
  .hl{ position:relative; padding:0 .12em; border-radius:2px; }
  .hl::before{
    content:""; position:absolute; inset:-2% -6%; background:var(--band); z-index:-1;
    transform:scaleX(0); transform-origin:left; transition:transform .35s ease;
  }
  .hl.on::before{ transform:scaleX(1); }

  /* ================= SCENE B — rose ================= */
  .band{
    position:absolute; inset:-20% -20%;
    background:linear-gradient(115deg, transparent 0 36%, var(--band) 36% 64%, transparent 64% 100%);
  }
  .rose-wrap{ position:absolute; top:8%; left:50%; width: clamp(120px, 20vw, 240px); transform:translateX(-50%) translateY(-14px) rotate(-6deg); opacity:0; transition:opacity .5s ease, transform .6s cubic-bezier(.2,1,.3,1); z-index:3; }
  .rose-wrap.on{ opacity:1; transform:translateX(-50%) translateY(0) rotate(-6deg); }
  .rose-text{ position:absolute; top:52%; left:50%; transform:translate(-50%,-50%); text-align:center; z-index:4; width:88%; }
  .rose-text .display{ font-size: clamp(24px, 5vw, 54px); font-weight:800; line-height:1.15; }
  .circle-mark{ position:absolute; z-index:5; pointer-events:none; }
  .circle-mark path{ fill:none; stroke:#ff5b5b; stroke-width:5; stroke-linecap:round; stroke-dasharray:340; stroke-dashoffset:340; }
  .circle-mark.on path{ transition:stroke-dashoffset 1.1s ease; stroke-dashoffset:0; }

  /* ================= SCENE C — photo grid ================= */
  .frame{
    position:absolute; background:var(--mat); padding: 12px;
    box-shadow:0 14px 26px -10px rgba(0,0,0,0.4);
    opacity:0; transition:opacity .5s ease, transform .7s cubic-bezier(.16,1,.3,1);
    z-index: 2;
  }
  .frame.on{ opacity:1; }
  .frame .breathe{ width:100%; height:100%; }
  .frame .photo{ width:100%; height:100%; background-size:cover; background-position:center; background-color:#c9c9c9; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  @keyframes breathe{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.045);} }
  .frame.on .breathe{ animation:breathe 6s ease-in-out infinite; }

  #gFrameTL{ --start:translate(-120%,-120%) rotate(-30deg); --settle:translate(0,0) rotate(-11deg); top:2%; left: 5%; width: min(300px, 32vw); aspect-ratio:4/5; }
  #gFrameTR{ --start:translate(120%,-120%) rotate(28deg); --settle:translate(0,0) rotate(8deg); top: 2%; right: 5%; width: min(290px, 30vw); aspect-ratio:4/5; }
  #gFrameBL{ --start:translate(-120%,120%) rotate(26deg); --settle:translate(0,0) rotate(-7deg); bottom: 2%; left: 5%; width: min(280px, 28vw); aspect-ratio:4/5; }
  #gFrameBR{ --start:translate(120%,120%) rotate(-28deg); --settle:translate(0,0) rotate(12deg); bottom: 2%; right: 5%; width: min(300px, 32vw); aspect-ratio:4/5; }
  .frame{ transform:var(--start); }
  .frame.on{ transform:var(--settle); }

  .grid-caption{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; z-index:20; text-align:center; pointer-events:none; }
  .grid-caption .display{ font-size: clamp(32px, 6vw, 70px); font-weight:800; background: rgba(255,255,255,0.7); backdrop-filter: blur(4px); padding: 5px 15px; border-radius: 8px; }
  .grid-dot{ position:absolute; border-radius:9999px; background:var(--mist); opacity:0; transition:opacity .4s ease; z-index:1; }
  .grid-dot.on{ opacity:1; }

  .wipe{
    position:absolute; top:50%; left:-70%; width:220%; height:220%;
    font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size: clamp(100px, 20vw, 300px); color:var(--ink);
    filter:blur(16px); opacity:0; transform:translate(-40%,-50%);
    display:flex; align-items:center; justify-content:center; z-index:8; pointer-events:none;
  }

  /* ================= SCENE D — clocks ================= */
  .clock-persp{ position:absolute; inset:0; perspective:900px; }
  .clock{
    position:absolute; width: min(260px, 35vw); aspect-ratio:1/1; border-radius:9999px;
    border:5px solid var(--ink); transform-style:preserve-3d;
    opacity:0; transition:opacity .5s ease;
  }
  .clock.on{ opacity:1; }
  .clock.spin{ animation:spin3d 6s linear infinite; }
  @keyframes spin3d{ from{ transform:rotateY(0deg);} to{ transform:rotateY(360deg);} }
  #clockL{ top:8%; left:5%; }
  #clockR{ bottom:10%; right:5%; }
  .tick{ position:absolute; width:3px; height:9%; background:var(--ink); left:50%; top:2%; transform-origin:50% 1500%; margin-left:-1.5px; }
  .hand{ position:absolute; left:50%; top:50%; background:var(--ink); border-radius:3px; transform-origin:0% 50%; }
  .hand.hh{ width:26%; height:5px; margin-top:-2.5px; animation:tickhh 6s linear infinite; }
  .hand.mm{ width:36%; height:4px; margin-top:-2px; animation:tickmm 3s linear infinite; }
  @keyframes tickhh{ from{ transform:rotate(20deg);} to{ transform:rotate(380deg);} }
  @keyframes tickmm{ from{ transform:rotate(-30deg);} to{ transform:rotate(330deg);} }
  .time-word{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); z-index:5; opacity:0; transition:opacity .4s ease; }
  .time-word.on{ opacity:1; }
  .time-word span{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size: clamp(30px, 5vw, 60px); background:var(--band); padding:.05em .28em; border-radius:2px; }

  /* ---------- Story Slide Styles ---------- */
  .story-text {
    font-family: 'Futura', 'Century Gothic', AppleGothic, sans-serif;
    color: #000000;
    font-size: clamp(14px, 2.5vw, 24px);
    letter-spacing: 0.05em;
    line-height: 1.6;
    text-align: center;
    padding: 0 32px;
    max-width: 85%;
    transition: opacity 0.3s ease;
  }
  .countdown-text {
    font-family: 'Futura', 'Century Gothic', AppleGothic, sans-serif;
    color: #ffffff;
    font-size: clamp(48px, 10vw, 96px);
    font-weight: bold;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .countdown-text.active {
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>

  <div id="stageWrap">
    <div id="stage">

      <!-- ===== STORY OVERLAY (Halaman 1-7) ===== -->
      <div id="storyStage" class="absolute inset-0 bg-white z-[150] flex items-center justify-center cursor-pointer select-none transition-all duration-700 ease-out">
        <div id="storyContent" class="story-text"></div>
      </div>

      <!-- ===== SCENE A: kinetic intro ===== -->
      <div class="layer" id="layerA">
        <div class="dot-field" id="dotsA"></div>
        <svg class="scribble-star" id="starA" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <polyline points="50,4 58,55 96,40 52,60 70,96 48,62 20,90 44,58 6,48 46,50 30,10 50,52" stroke="#111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>

        <div class="a-sub" id="subA1">
          <div class="ghost display font-extrabold text-[40px]" id="ghostA1"></div>
          <div class="front display font-extrabold text-[40px] px-[6%]" id="frontA1"></div>
        </div>
        <div class="bigmark" id="markA">?</div>

        <div class="a-sub" id="subA2">
          <div class="zoomline"><div class="txt" id="zoomTxt"></div></div>
        </div>
      </div>

      <!-- ===== SCENE B: rose ===== -->
      <div class="layer" id="layerB">
        <div class="band"></div>
        <div class="rose-wrap" id="roseArt">
          <svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
            <path d="M50 150 C 48 120, 46 100, 50 70" stroke="var(--leaf)" stroke-width="3" fill="none" stroke-linecap="round"/>
            <path d="M50 110 C 40 108, 30 116, 24 108" stroke="var(--leaf)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <ellipse cx="20" cy="106" rx="9" ry="5" fill="var(--leaf)" transform="rotate(-20 20 106)"/>
            <path d="M50 128 C 60 126, 68 134, 76 128" stroke="var(--leaf)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
            <ellipse cx="78" cy="126" rx="9" ry="5" fill="var(--leaf)" transform="rotate(20 78 126)"/>
            <g>
              <circle cx="50" cy="42" r="26" fill="var(--rose-dark)"/>
              <path d="M50 20 C 66 22, 74 34, 70 46 C 66 58, 50 62, 40 54 C 34 48, 36 38, 44 34 C 50 31, 56 34, 56 40 C 56 44, 52 46, 49 44" fill="var(--rose)"/>
              <path d="M50 42 C 40 36, 30 40, 28 50 C 27 58, 35 64, 44 62" fill="var(--rose)"/>
              <path d="M50 42 C 60 36, 70 42, 70 52 C 70 60, 62 64, 54 60" fill="var(--rose)" opacity=".9"/>
            </g>
          </svg>
        </div>
        <div class="rose-text">
          <h1 class="display" id="roseLine"></h1>
        </div>
        <svg class="circle-mark" id="roseCircle" viewBox="0 0 140 60" style="top:57%; left:56%; width:34%;">
          <path d="M8 30 C 8 10, 40 4, 70 8 C 105 12, 132 22, 128 34 C 124 46, 90 52, 55 50 C 25 48, 8 42, 8 30" />
        </svg>
      </div>

      <!-- ===== SCENE C: photo grid ===== -->
      <div class="layer" id="layerC">
        <div class="frame" id="gFrameTL"><div class="breathe"><div class="photo" id="gphoto1"></div></div></div>
        <div class="frame" id="gFrameTR"><div class="breathe"><div class="photo" id="gphoto2"></div></div></div>
        <div class="frame" id="gFrameBL"><div class="breathe"><div class="photo" id="gphoto3"></div></div></div>
        <div class="frame" id="gFrameBR"><div class="breathe"><div class="photo" id="gphoto4"></div></div></div>

        <div class="grid-dot" id="gd1" style="width:9%; aspect-ratio:1/1; top:19%; right:26%;"></div>
        <div class="grid-dot" id="gd2" style="width:6%; aspect-ratio:1/1; top:26%; right:21%;"></div>

        <div class="grid-caption" id="captionSeeHere"><h1 class="display"></h1></div>
        <div class="grid-caption" id="captionBackMind"><h1 class="display"></h1></div>

        <div class="wipe" id="gridWipe">?</div>
      </div>

      <!-- ===== SCENE D: clocks ===== -->
      <div class="layer" id="layerD">
        <div class="clock-persp">
          <div class="clock" id="clockL">
            <div class="hand hh"></div><div class="hand mm"></div>
          </div>
          <div class="clock" id="clockR">
            <div class="hand hh"></div><div class="hand mm"></div>
          </div>
        </div>
        <div class="time-word" id="timeWord"><span>time</span></div>
        <div class="grid-dot" style="width:6%; aspect-ratio:1/1; top:10%; right:20%;" id="dd1"></div>
        <div class="grid-dot" style="width:8%; aspect-ratio:1/1; top:38%; left:8%;" id="dd2"></div>
      </div>

      <!-- ===== END OVERLAY ===== -->
      <div id="endOverlay" class="absolute inset-0 bg-black z-[200] opacity-0 transition-opacity duration-1000 pointer-events-none" style="display: none;"></div>

    </div>
  </div>

  <audio id="track" preload="auto"></audio>

  <script>
    const CONFIG = {
      photo1: "kia1.jpeg",
      photo2: "kia2.png",
      photo3: "kia3.png",
      photo4: "kia4.png",
      audioSrc: "kiamusik.mp3"
    };

    document.getElementById('gphoto1').style.backgroundImage = `url('${CONFIG.photo1}')`;
    document.getElementById('gphoto2').style.backgroundImage = `url('${CONFIG.photo2}')`;
    document.getElementById('gphoto3').style.backgroundImage = `url('${CONFIG.photo3}')`;
    document.getElementById('gphoto4').style.backgroundImage = `url('${CONFIG.photo4}')`;

    const T = {
      total: 24.3,
      A1: [0.0, 4.5],
      A2: [4.5, 7.6],
      B:  [7.6, 12.6],
      C1: [12.6, 15.6],
      C2: [15.6, 18.6],
      D:  [18.6, 23.6],
    };
    const FADE = 0.35;

    function buildWords(container, words, timings, cls){
      container.innerHTML = '';
      const els = [];
      words.forEach((w,i)=>{
        const span = document.createElement('span');
        span.className = cls || 'lyric-word';
        span.dataset.t = timings[i];
        span.textContent = w + (i < words.length-1 ? ' ' : '');
        container.appendChild(span);
        els.push(span);
      });
      return els;
    }

    const a1Words = ["and","I","know","you","love","me"];
    const a1Timings = [0.0,0.35,0.65,1.0,1.5,2.0];
    const ghostA1 = document.getElementById('ghostA1');
    const frontA1 = document.getElementById('frontA1');
    ghostA1.textContent = a1Words.join(' ');
    const a1Els = buildWords(frontA1, a1Words, a1Timings);

    const zoomTxt = document.getElementById('zoomTxt');
    zoomTxt.innerHTML = `you'd remind <span class="hl" id="hlMe">me</span>`;

    const bWords = ["wanna","put","it","all","behind","me"];
    const bTimings = [0.0,0.3,0.55,0.8,1.15,1.55];
    const roseLine = document.getElementById('roseLine');
    const bEls = buildWords(roseLine, bWords, bTimings);

    const c1Words = ["I","see","here"];
    const c1Timings = [0.0,0.4,0.8];
    const c1Els = buildWords(document.querySelector('#captionSeeHere h1'), c1Words, c1Timings);

    const c2Words = ["in","the","back","of","my","mind"];
    const c2Timings = [0.0,0.25,0.5,0.85,1.15,1.4];
    const c2Els = buildWords(document.querySelector('#captionBackMind h1'), c2Words, c2Timings);

    const dotsA = document.getElementById('dotsA');
    const dotDefs = [
      {w:5,t:4,l:60}, {w:8,t:18,l:80}, {w:4,t:34,l:88}, {w:6,t:52,l:8}, {w:5,t:70,l:14}
    ];
    const dotEls = dotDefs.map(d=>{
      const s = document.createElement('span');
      s.style.width = d.w+'%'; s.style.aspectRatio='1/1';
      s.style.top = d.t+'%'; s.style.left = d.l+'%';
      dotsA.appendChild(s);
      return s;
    });

    [document.getElementById('clockL'), document.getElementById('clockR')].forEach(clock=>{
      for(let i=0;i<12;i++){
        const t = document.createElement('div');
        t.className='tick';
        t.style.transform = `rotate(${i*30}deg)`;
        clock.appendChild(t);
      }
    });

    function fadeWindow(t, start, end){
      if (t < start - FADE || t > end + FADE) return 0;
      if (t < start) return Math.max(0,(t-(start-FADE))/FADE);
      if (t > end) return Math.max(0,1-((t-end)/FADE));
      return 1;
    }
    function within(t,start,end){ return t>=start && t<=end; }

    function render(t){
      t = ((t % T.total) + T.total) % T.total;

      const aOn = fadeWindow(t, T.A1[0], T.A2[1]);
      const layerA = document.getElementById('layerA');
      layerA.style.opacity = aOn;
      layerA.classList.toggle('show', aOn > 0.02);

      const inA1 = within(t, T.A1[0], T.A1[1]);
      document.getElementById('subA1').style.opacity = inA1 ? 1 : 0;
      document.getElementById('subA2').style.opacity = inA1 ? 0 : 1;

      if (inA1){
        const rt = t - T.A1[0];
        a1Els.forEach(el=> el.classList.toggle('on', rt >= parseFloat(el.dataset.t)));
        document.getElementById('starA').classList.toggle('on', rt >= 0.15);
        document.getElementById('markA').classList.toggle('on', rt >= 2.6);
        dotEls.forEach((el,i)=> el.classList.toggle('on', rt >= i*0.18));
      } else {
        const rt = t - T.A2[0];
        const prog = Math.max(0, Math.min(1, rt / (T.A2[1]-T.A2[0])));
        document.getElementById('zoomTxt').style.transform = `translateX(${(1-prog)*40 - 10}%)`;
        document.getElementById('hlMe').classList.toggle('on', rt >= 1.9);
      }

      const bOn = fadeWindow(t, T.B[0], T.B[1]);
      const layerB = document.getElementById('layerB');
      layerB.style.opacity = bOn;
      layerB.classList.toggle('show', bOn > 0.02);
      if (within(t, T.B[0]-FADE, T.B[1]+FADE)){
        const rt = t - T.B[0];
        document.getElementById('roseArt').classList.toggle('on', rt >= 0.1);
        bEls.forEach(el=> el.classList.toggle('on', rt >= parseFloat(el.dataset.t)));
        document.getElementById('roseCircle').classList.toggle('on', rt >= 2.4);
      }

      const cOn = fadeWindow(t, T.C1[0], T.C2[1]);
      const layerC = document.getElementById('layerC');
      layerC.style.opacity = cOn;
      layerC.classList.toggle('show', cOn > 0.02);
      const framesOn = t >= T.C1[0]-FADE && t <= T.C2[1]+FADE;
      ['gFrameTL','gFrameTR','gFrameBL','gFrameBR'].forEach(id=>{
        document.getElementById(id).classList.toggle('on', framesOn);
      });
      document.getElementById('gd1').classList.toggle('on', framesOn);
      document.getElementById('gd2').classList.toggle('on', framesOn);

      const inC1 = within(t, T.C1[0], T.C1[1]);
      const inC2 = within(t, T.C2[0], T.C2[1]);
      document.getElementById('captionSeeHere').style.opacity = inC1 ? 1 : 0;
      document.getElementById('captionBackMind').style.opacity = inC2 ? 1 : 0;
      if (inC1){ const rt=t-T.C1[0]; c1Els.forEach(el=>el.classList.toggle('on', rt>=parseFloat(el.dataset.t))); }
      if (inC2){ const rt=t-T.C2[0]; c2Els.forEach(el=>el.classList.toggle('on', rt>=parseFloat(el.dataset.t))); }

      const wipeStart = T.C1[1]-0.3, wipeEnd = T.C2[0]+0.3;
      const wipe = document.getElementById('gridWipe');
      if (t >= wipeStart && t <= wipeEnd){
        const p = (t-wipeStart)/(wipeEnd-wipeStart);
        wipe.style.opacity = Math.sin(p*Math.PI)*0.9;
        wipe.style.transform = `translate(${-40+p*90}%,-50%)`;
      } else { wipe.style.opacity = 0; }

      const dOn = fadeWindow(t, T.D[0], T.D[1]);
      const layerD = document.getElementById('layerD');
      layerD.style.opacity = dOn;
      layerD.classList.toggle('show', dOn > 0.02);
      const dActive = t >= T.D[0]-FADE && t <= T.D[1]+FADE;
      document.getElementById('clockL').classList.toggle('on', dActive);
      document.getElementById('clockR').classList.toggle('on', dActive);
      document.getElementById('clockL').classList.toggle('spin', dActive);
      document.getElementById('clockR').classList.toggle('spin', dActive);
      document.getElementById('timeWord').classList.toggle('on', dActive);
      document.getElementById('dd1').classList.toggle('on', dActive);
      document.getElementById('dd2').classList.toggle('on', dActive);
    }

    const track = document.getElementById('track');
    track.src = CONFIG.audioSrc;

    let hasRealAudio = false;
    let playing = false;
    let demoTime = 0;
    let raf = null;
    let lastTick = 0;

    function loop(now){
      if (!playing) return;
      const dt = (now-lastTick)/1000; lastTick = now;
      
      if (!hasRealAudio){
        demoTime += dt;
        if (demoTime >= T.total) {
          endSequence();
          return;
        }
      }
      
      const t = hasRealAudio ? track.currentTime : demoTime;
      render(t);
      raf = requestAnimationFrame(loop);
    }

    function play(){
      playing = true;
      lastTick = performance.now();
      if (hasRealAudio) {
        track.play().catch(err => {
          console.warn("Audio play interrupted:", err);
        });
      }
      raf = requestAnimationFrame(loop);
    }

    function pause(){
      playing = false;
      if (hasRealAudio) track.pause();
      if (raf) cancelAnimationFrame(raf);
    }

    track.addEventListener('ended', ()=>{ 
      endSequence();
    });

    track.addEventListener('loadedmetadata', ()=>{ 
      T.total = track.duration; 
    });

    function endSequence() {
      pause();
      const endOverlay = document.getElementById('endOverlay');
      endOverlay.style.display = 'block';
      void endOverlay.offsetWidth;
      endOverlay.style.opacity = '1';
    }

    const storyTexts = [
      "tekan untuk lanjut",
      "aku sebenarnya nggak ngerti harus mulai dari mana -",
      "jadi, aku mulai dari hal yang paling sederhana -",
      "terima kasih telah mampir ke berandaku -",
      "terima kasih telah membuat beberapa hari ini terasa lebih menyenangkan -",
      "dan ada satu hal sialan lagi......"
    ];

    let currentStep = 1;
    const storyStage = document.getElementById('storyStage');
    const storyContent = document.getElementById('storyContent');

    function updateStory() {
      if (currentStep >= 1 && currentStep <= 6) {
        storyStage.style.backgroundColor = '#ffffff';
        storyContent.className = 'story-text';
        storyContent.style.color = '#000000';
        storyContent.textContent = storyTexts[currentStep - 1];
      } else if (currentStep === 7) {
        storyStage.style.backgroundColor = '#000000';
        storyContent.textContent = '';
      } else if (currentStep === 8) {
        storyStage.style.backgroundColor = '#000000';
        storyStage.style.pointerEvents = 'none';
        runCountdown();
      }
    }

    function runCountdown() {
      let count = 3;
      storyContent.className = 'countdown-text';
      storyContent.style.color = '#ffffff';
      
      function showCount() {
        if (count > 0) {
          storyContent.textContent = count;
          storyContent.classList.remove('active');
          void storyContent.offsetWidth;
          storyContent.classList.add('active');
          count--;
          setTimeout(showCount, 1000);
        } else {
          startMainSequence();
        }
      }
      showCount();
    }

    function startMainSequence() {
      currentStep = 9;
      storyStage.style.opacity = '0';
      setTimeout(() => {
        storyStage.style.display = 'none';
      }, 700);

      if (CONFIG.audioSrc && CONFIG.audioSrc !== "") {
        hasRealAudio = true;
        track.muted = false;
        track.currentTime = 0;
        track.play().then(() => {
          play();
        }).catch(err => {
          console.warn("Autoplay block / file error. Starting in demo mode:", err);
          startDemoSequence();
        });
      } else {
        startDemoSequence();
      }
    }

    function startDemoSequence() {
      hasRealAudio = false;
      play();
    }

    let audioUnlocked = false;
    function unlockAudio() {
      if (!audioUnlocked && CONFIG.audioSrc && CONFIG.audioSrc !== "") {
        track.muted = true;
        track.play().then(() => {
          track.pause();
          track.currentTime = 0;
          track.muted = false;
          audioUnlocked = true;
          console.log("Audio context unlocked silently.");
        }).catch(err => {
          console.log("Audio unlock pending interaction:", err);
        });
      }
    }

    storyStage.addEventListener('click', () => {
      unlockAudio();
      if (currentStep < 8) {
        currentStep++;
        updateStory();
      }
    });

    updateStory();
    render(0);
  </script>
</body>
</html>
